<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.ord">
<head>
<meta charset="ISO-8859-1">
<title>Viraj Tech</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body>
<h1>Employee Management System</h1>
<nav class="navbar navbar-dark bg-dark">
<span>
<a th:href="@{/}" class="navbar-brand">HOME</a>
<a th:href="@{/addEmployee}" class="navbar-brand">Add Employee</a>
</span>
</nav>
<div class="container text-center col-4">
<h2>EDIT Employee</h2>
<form action="#" th:action="@{/saveEmployee}" th:object="${employee}" method="post">
<input type="hidden" th:field="*{id}">
<input type="text" th:field="*{firstName}" placeholder="First Name" class="form-control mb-4">
<input type="text" th:field="*{lastName}" placeholder="Last Name" class="form-control mb-4">
<input type="text" th:field="*{userName}" placeholder="User Name" class="form-control mb-4">
<input type="text" th:field="*{address}" placeholder="Address" class="form-control mb-4">
<input type="text" th:field="*{email}" placeholder="Email" class="form-control mb-4">
<input type="text" th:field="*{phno}" placeholder="Phone Number" class="form-control mb-4">
<input type="text" th:field="*{salary}" placeholder="Salary" class="form-control mb-4">
<button type="submit" class="btn btn-primary">UPDATE</button>
</form>
</div>

</body>
</html>
