<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.ord">
<head>
<meta charset="ISO-8859-1">
<title>Viraj Tech</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>
<body>
<h1>Employee Management System</h1>
<nav class="navbar navbar-dark bg-dark">
<span>
<a th:href="@{/}" class="navbar-brand">HOME</a>
<a th:href="@{/addEmployee}" class="navbar-brand">Add Employee</a>
</span>
</nav>
<div class="container">
<table class="table" border="1">
<tr>
<th>Employee First Name</th>
<th>Employee Last Name</th>
<th>Employee User Name</th>
<th>Employee Address</th>
<th>Employee Email</th>
<th>Employee Phone Number</th>
<th>Employee Salary</th>
<th>Action</th>
</tr>
<tr th:each="employee:${listEmployees}">
<td th:text="${employee.firstName}">
<td th:text="${employee.lastName}">
<td th:text="${employee.userName}">
<td th:text="${employee.address}">
<td th:text="${employee.email}">
<td th:text="${employee.phno}">
<td th:text="${employee.salary}">
<td>
<a th:href="@{/updateEmployee/{id}(id=${employee.id})}" class="btn btn-primary">UPDATE</a>
<a th:href="@{/deleteEmployee/{id}(id=${employee.id})}" class="btn btn-danger">DELETE</a>
</td>
</tr>
</table>

</div>

</body>
</html>
